[platformio]
default_envs = esp32s3

; Settings shared by every firmware env. Platform is pinned so local and CI builds
; match: espressif32 7.1.3 = Arduino-ESP32 core 2.0.17 on ESP-IDF 4.4.
[esp32_base]
platform = espressif32@7.1.3
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
; The Arduino core hard-codes gnu++11; we use C++17.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17

; Main target: ESP32-S3-DevKitC-1 with WROOM-1-N16R8 (16 MB quad flash, 8 MB octal PSRAM).
; The stock board JSON describes the N8 (8 MB, no PSRAM), so flash size, memory type
; and partitions are overridden here. memory_type MUST be qio_opi: opi_opi would
; switch the flash to octal/DOUT and boot-loop this module.
[env:esp32s3]
extends = esp32_base
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_16MB.csv
build_flags =
    ${esp32_base.build_flags}
    -DBOARD_HAS_PSRAM

[env:esp32dev]
extends = esp32_base
board = esp32dev

[env:c3]
extends = esp32_base
board = esp32-c3-devkitm-1
build_flags =
    ${esp32_base.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Host-side unit tests for lib/core (no hardware). Run: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
    -Itest
