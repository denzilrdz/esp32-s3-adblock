name: build

# Every push to main and every pull request: format check, clang-tidy, unit tests
# (with coverage), the blocklist tool tests, and firmware builds for all boards.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install pinned tools (uv.lock)
        run: uv sync --locked
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-native-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Format check (clang-format + black)
        run: tools/format.sh --check
      - name: clang-tidy (lib/core)
        run: tools/lint.sh
      - name: Blocklist tool tests
        run: .venv/bin/python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Native unit tests (AddressSanitizer + UBSan)
        run: .venv/bin/pio test -e native
      - name: Coverage
        run: tools/coverage.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/

  firmware:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        env: [esp32s3, c3, esp32dev]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ matrix.env }}-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Placeholder secrets (real ones are gitignored; first boot uses the setup code)
        run: cp src/secrets.example.h src/secrets.h
      - name: Build
        run: .venv/bin/pio run -e ${{ matrix.env }}
      - name: Factory image
        run: tools/make_factory.sh ${{ matrix.env }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-${{ matrix.env }}
          path: |
            .pio/build/${{ matrix.env }}/firmware.bin
            .pio/build/${{ matrix.env }}/factory.bin
            .pio/build/${{ matrix.env }}/firmware.elf
