name: blocklist

# Rebuilds the default blocklist daily and publishes it at a stable URL:
#   https://github.com/<owner>/<repo>/releases/download/blocklist/blocklist.bin  (format v2)
# Devices fetch it daily at 02:00 local time + 0-10 min jitter (ETag: unchanged lists
# are not re-downloaded).
on:
  schedule:
    - cron: "30 18 * * *" # 18:30 UTC = 00:00 IST, 3 h before boards update at 03:00 IST
  workflow_dispatch:

permissions: {}

concurrency:
  group: blocklist
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # update the 'blocklist' release assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The builder only needs the Python standard library (runner's python3).
      - name: Build default blocklist (fails if any source is unreachable)
        run: |
          set -o pipefail
          python3 tools/build_blocklist.py blocklist.bin 2>&1 | tee build.log
      - name: Sanity checks
        run: |
          size=$(stat -c%s blocklist.bin)
          echo "size=$size bytes"
          head -c 4 blocklist.bin | grep -q ADBL                  # v2 magic
          test $(( (size - 32 - 4 * 65537) % 4 )) -eq 0            # whole 32-bit entries
          test "$size" -gt $((32 + 4 * 65537 + 4 * 50000))         # >50k entries, catches a silently shrunk list
          test "$size" -lt 3900000                                 # fits next to a download temp file on the S3
      - name: Publish to the 'blocklist' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Same list as the published one: keep the asset (and its ETag), so boards skip the
          # download. Bytes 16-23 hold the build time; count and CRC (8-15) follow from the
          # payload, which is compared in full, so skip the first 24 bytes.
          if gh release download blocklist --pattern blocklist.bin --output current.bin &&
            cmp -s -i 24 blocklist.bin current.bin; then
            echo "blocklist unchanged, not re-uploading"
            exit 0
          fi
          entries=$(( ($(stat -c%s blocklist.bin) - 32 - 4 * 65537) / 4 ))
          notes="Auto-built $(date -u +%F): ${entries} entries (StevenBlack base + Hagezi Light).

          Device setting (Blocklist URL):
          https://github.com/${GITHUB_REPOSITORY}/releases/download/blocklist/blocklist.bin"
          if gh release view blocklist >/dev/null 2>&1; then
            gh release edit blocklist --title "Daily blocklist" --notes "$notes"
          else
            gh release create blocklist --title "Daily blocklist" --notes "$notes" --latest=false
          fi
          gh release upload blocklist blocklist.bin --clobber
