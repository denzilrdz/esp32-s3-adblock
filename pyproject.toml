# Python side of the project: the blocklist builder (tools/, standard library only)
# and the pinned developer/CI tools. Managed with uv: `uv sync` creates .venv from
# uv.lock (tools/setup-dev.sh does this). Not a Python package.
[project]
name = "esp32-s3-adblock-tools"
version = "0.1.0"
description = "Blocklist builder and developer tooling for the esp32-s3-adblock firmware"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "black==26.10.1",
  "clang-format==23.1.3",
  "clang-tidy==22.1.8",
  "gcovr==8.6",
  "platformio==6.2.0",
  "pre-commit==4.7.0",
]

[tool.uv]
package = false

[tool.black]
line-length = 88
target-version = ["py311"]
