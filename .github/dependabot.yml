# Keeps SHA-pinned GitHub Actions and the uv-locked Python tools up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    groups:
      dev-tools:
        patterns: ["*"]
