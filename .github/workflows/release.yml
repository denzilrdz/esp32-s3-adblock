name: release

# On a version tag (vX.Y.Z): build the ESP32-S3 firmware, attach binaries with build-provenance
# attestations to a GitHub Release (notes from CHANGELOG.md), and publish the browser
# installer to GitHub Pages. No caches here: release artifacts never consume cache
# entries another workflow could have poisoned.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firmware:
    name: firmware (esp32s3)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: uv sync --locked
      - name: Tag must match FW_VERSION in platformio.ini
        run: |
          want="${GITHUB_REF_NAME#v}"
          grep -q "FW_VERSION=\\\\\"${want}\\\\\"" platformio.ini || { echo "platformio.ini FW_VERSION != ${want}"; exit 1; }
      - run: cp src/secrets.example.h src/secrets.h
      - run: .venv/bin/pio run -e esp32s3
      - name: Collect binaries
        run: |
          v="${GITHUB_REF_NAME}"
          b=".pio/build/esp32s3"
          mkdir -p dist
          tools/make_factory.sh "dist/factory-esp32s3-${v}.bin"
          cp "$b/firmware.bin" "dist/firmware-esp32s3-${v}.bin"
          cp "$b/firmware.elf" "dist/firmware-esp32s3-${v}.elf"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  release:
    name: release
    needs: firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload assets
      id-token: write # sign build-provenance attestations (Sigstore)
      attestations: write # store the attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {if (p) exit} p' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for ${v}"; exit 1; }
      - name: Checksums
        run: cd dist && sha256sum ./*.bin > SHA256SUMS
      - name: Build-provenance attestations (verify with 'gh attestation verify <file> -R <owner/repo>')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.bin
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag

  installer:
    name: installer
    needs: firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write # deploy the installer site
      id-token: write # authenticate the Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Vendor esp-web-tools (pinned version + SHA-512 from installer/esp-web-tools.lock)
        run: |
          ver=$(sed -n 's/^version=//p' installer/esp-web-tools.lock)
          want=$(sed -n 's/^integrity=sha512-//p' installer/esp-web-tools.lock)
          curl -fsSL "https://registry.npmjs.org/esp-web-tools/-/esp-web-tools-${ver}.tgz" -o ewt.tgz
          got=$(openssl dgst -sha512 -binary ewt.tgz | base64 -w0)
          test "$got" = "$want" || { echo "esp-web-tools ${ver}: integrity mismatch"; exit 1; }
          mkdir -p ewt site/vendor/esp-web-tools
          tar -xzf ewt.tgz -C ewt
          cp ewt/package/dist/web/*.js site/vendor/esp-web-tools/
      - name: Assemble installer site
        run: |
          v="${GITHUB_REF_NAME}"
          cp installer/index.html site/
          cp "dist/factory-esp32s3-${v}.bin" site/factory-esp32s3.bin
          sed "s/__VERSION__/${v#v}/" installer/manifest.json > site/manifest.json
          # Dashboard "Check for updates": the browser fetches these from Pages (release
          # downloads send no CORS headers) and uploads the firmware to the device.
          cp "dist/firmware-esp32s3-${v}.bin" site/firmware-esp32s3.bin
          # installer/min-update-from: oldest version that may install this release from
          # the dashboard (raise it for releases that need a USB flash).
          python3 tools/make_update_json.py --min-update-from "$(tr -d '[:space:]' < installer/min-update-from)" \
            site/firmware-esp32s3.bin "$v" site/update.json \
            "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${v}"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
