name: release

# On a version tag (vX.Y.Z): build every board, attach binaries to a GitHub Release
# with notes from CHANGELOG.md, and publish the browser installer to GitHub Pages.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        env: [esp32s3, c3, esp32dev]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - name: Tag must match FW_VERSION in platformio.ini
        run: |
          want="${GITHUB_REF_NAME#v}"
          grep -q "FW_VERSION=\\\\\"${want}\\\\\"" platformio.ini || { echo "platformio.ini FW_VERSION != ${want}"; exit 1; }
      - run: cp src/secrets.example.h src/secrets.h
      - run: .venv/bin/pio run -e ${{ matrix.env }}
      - name: Collect binaries
        run: |
          v="${GITHUB_REF_NAME}"
          b=".pio/build/${{ matrix.env }}"
          tools/make_factory.sh ${{ matrix.env }} "dist/factory-${{ matrix.env }}-${v}.bin"
          cp "$b/firmware.bin" "dist/firmware-${{ matrix.env }}-${v}.bin"
          cp "$b/firmware.elf" "dist/firmware-${{ matrix.env }}-${v}.elf"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.env }}
          path: dist/

  release:
    needs: firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {if (p) exit} p' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for ${v}"; exit 1; }
      - name: Checksums
        run: cd dist && sha256sum *.bin > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag

  installer:
    needs: firmware
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Assemble installer site
        run: |
          v="${GITHUB_REF_NAME}"
          mkdir -p site
          cp installer/index.html site/
          for e in esp32s3 c3 esp32dev; do cp "dist/factory-${e}-${v}.bin" "site/factory-${e}.bin"; done
          sed "s/__VERSION__/${v#v}/" installer/manifest.json > site/manifest.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
