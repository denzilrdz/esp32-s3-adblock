# Keeps SHA-pinned GitHub Actions and the uv-locked Python tools up to date. The
# cooldown waits before proposing a brand-new release, so a compromised version is
# usually caught and yanked before it reaches this repo (security updates are not
# delayed).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    commit-message:
      prefix: chore
    groups:
      dev-tools:
        patterns: ["*"]
